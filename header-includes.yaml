    \fancyhead[C]{
      \begin{tikzpicture}[remember picture,overlay]
        \node[anchor=north, inner sep=0pt] at (current page.north) {
          \includegraphics[width=\paperwidth]{PNRR_header.png}
        };
      \end{tikzpicture}
    }
    
    \fancyfoot[C]{
      \begin{tikzpicture}[remember picture,overlay]
        \node[anchor=south, inner sep=0pt] at (current page.south) {
          \includegraphics[width=\paperwidth]{PNRR_footer.png}
        };
      \end{tikzpicture}
    }
    
    \renewcommand{\headrulewidth}{0pt}
    \renewcommand{\footrulewidth}{0pt}
geometry:
